<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apiary — RAA real design system reference</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <!-- Real, separate CSS files — find the one that covers what you want to
       restyle. theme.css is the one file to check first: every colour and
       font used anywhere on the site is a variable defined there. -->
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/sidebar.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/prose.css">
</head>
<body>
  <div id="root"></div>

  <!--
    Everything below is real, editable, plain-text source — no build step.
    partials/ = reusable chrome (header, sidebar, tabs, preview engine).
    pages/    = one file per page type.
    content/  = every real markdown/JSON value the site shows.
    See README.md for the full explanation and editing workflow.
  -->
  <script src="./js/config.js"></script>
  <script type="module" src="./js/0-bootstrap.mjs"></script>
  <script src="./js/0-markdown.js"></script>
  <script src="./js/1-draft-store.js"></script>
  <script src="./js/2-search-index.js"></script>

  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script>
    Babel.registerPreset("apiary-react", {
      presets: [[Babel.availablePresets["react"], { runtime: "classic" }]],
    });
  </script>

  <!-- Partials — reusable chrome, loaded first so pages below can use them. -->
  <script type="text/babel" data-presets="apiary-react" src="./partials/preview-engine.jsx"></script>
  <script type="text/babel" data-presets="apiary-react" src="./partials/layout-chrome.jsx"></script>
  <script type="text/babel" data-presets="apiary-react" src="./partials/markdown-view.jsx"></script>
  <script type="text/babel" data-presets="apiary-react" src="./partials/header.jsx"></script>
  <script type="text/babel" data-presets="apiary-react" src="./partials/sidebar.jsx"></script>
  <script type="text/babel" data-presets="apiary-react" src="./partials/editable.jsx"></script>

  <!-- Pages -->
  <script type="text/babel" data-presets="apiary-react" src="./pages/detail-page.jsx"></script>
  <script type="text/babel" data-presets="apiary-react" src="./pages/foundations-page.jsx"></script>
  <script type="text/babel" data-presets="apiary-react" src="./pages/get-started-page.jsx"></script>
  <script type="text/babel" data-presets="apiary-react" src="./pages/home.jsx"></script>
  <script type="text/babel" data-presets="apiary-react" src="./pages/app.jsx"></script>
</body>
</html>
