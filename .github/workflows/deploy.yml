name: Build and deploy to GitHub Pages

# Runs the real build (npm run build) on every push to main, then deploys
# the dist/ output to GitHub Pages. Requires one one-time repo setting
# change: Settings -> Pages -> Source -> "GitHub Actions" (instead of
# "Deploy from a branch", which was the old no-build setup).

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
